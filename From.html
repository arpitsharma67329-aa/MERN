<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/submit-data" method="POST">
  <!-- Text Input Field -->
  <div>

    <label for="username">Name:</label>
    <input type="text" id="username" name="username" placeholder="Your Name" required> 

</div>


  <!-- Email Input Field -->
  <div>
    <label for="useremail">Email:</label>
    <input type="email" id="useremail" name="useremail" placeholder="name@example.com" required>
  </div>

  <!-- Roll Number Input Field -->
  <div>
    <label for="rollno">Roll No:</label>
    <input type="number" id="rollno" name="rollno" placeholder="Enter Roll Number" required>
  </div>

  <!-- Gender Radio Buttons -->
  <div>
    <label>Gender:</label>
    <label>
      <input type="radio" name="gender" value="male" required> Male
    </label>
    <label>
      <input type="radio" name="gender" value="female"> Female
    </label>
  </div>

  <!-- Interests Checkboxes -->
  <div>
    <label>Interests:</label>
    <label>
      <input type="checkbox" name="interests" value="coding"> Coding
    </label>
    <label>
      <input type="checkbox" name="interests" value="dancing"> Dancing
    </label>
    <label>
      <input type="checkbox" name="interests" value="music"> Music
    </label>
    <label>
      <input type="checkbox" name="interests" value="politics"> Politics
    </label>
  </div>

  <!-- Submit Button -->
  <button type="submit">Submit</button>
</form>

    
</body>
</html>
